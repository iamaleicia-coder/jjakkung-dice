<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>짝꿍 만나러 가요! 온라인 놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 온라인 놀이: 폰·태블릿 하나를 돌려 가며 2~4명이 함께 해요.
   주사위(./?embed=1)를 던지면 고른 쪽으로 두더지 말이 움직이고, 그림 칸에 서면 질문 카드가 저절로 떠요.
   친구네 집에 들어가면 짝꿍 만나기 성공! */
:root {
  color-scheme: light;
  --ink: #4a2a12; --muted: #8a5a30; --line: #d9934e; --paper: #fff4e0;
  --purple: #7a3e9d; --boom: #e8402a;
  --display: "Jua", "Gowun Dodum", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; min-width: 0; }
html, body { height: 100%; margin: 0; }
body { background: radial-gradient(120% 70% at 50% 40%, #fbd7a0, #eea461 70%, #e08c45); background-color: #eea461; color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; }
#app { height: 100%; display: grid; grid-template-columns: minmax(0, 7fr) minmax(220px, 3fr); gap: 6px; padding: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
#boardwrap { min-height: 0; display: grid; place-items: center; container-type: size; }
#board { position: relative; aspect-ratio: 1536 / 1024; width: 100%; height: auto; max-width: 100%; max-height: 100%; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 24px rgba(110,50,10,.25); }
@container (min-aspect-ratio: 1536/1024) { #board { width: auto; height: 100%; } }
#board > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
.spot { position: absolute; width: 6.6%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 0; padding: 0; background: transparent; cursor: pointer; z-index: 3; }
.spot.hint::before { content: ""; position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.9) 0 25%, rgba(255,224,110,.55) 45%, rgba(255,224,110,0) 70%); animation: twinkle .9s ease-in-out infinite alternate; }
.spot.hint::after { content: "✦"; position: absolute; right: -2%; top: -8%; font-size: clamp(.7rem, 2.6cqh, 1.2rem); color: #ffd84a; text-shadow: 0 0 4px #fff, 0 0 2px #a86a00; animation: twinkle .7s ease-in-out infinite alternate-reverse; }
@keyframes twinkle { from { opacity: .35; transform: scale(.85); } to { opacity: 1; transform: scale(1.05); } }
.piece { position: absolute; width: 6.6%; transform: translate(-50%, -88%); transition: left .22s ease, top .22s ease; z-index: 2; pointer-events: none; filter: drop-shadow(0 3px 2px rgba(60,25,5,.45)); }
.piece img { width: 100%; display: block; }
.piece.turn { z-index: 4; filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 6px #fff7) drop-shadow(0 3px 2px rgba(60,25,5,.45)); }
.piece.turn::after { content: "▼"; position: absolute; left: 50%; top: -26%; transform: translateX(-50%); color: var(--purple); font-size: clamp(.8rem, 3cqh, 1.4rem); animation: bob .8s ease-in-out infinite alternate; text-shadow: 0 0 3px #fff; }
.piece.hop { animation: hop .22s ease-out; }
@keyframes hop { 40% { margin-top: -2.6%; } }
@keyframes bob { to { margin-top: -4px; } }
#side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; }
#qref { justify-self: center; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border: 1.5px dashed var(--muted); border-radius: 18px; background: rgba(255,244,224,.6); color: var(--muted); font: .8125rem var(--body); cursor: pointer; }
#qref svg { width: 18px; height: 18px; }
#qcardview .box { width: min(100%, 560px); padding: 14px; gap: 10px; }
#qcardview img { width: 100%; height: auto; display: block; border-radius: 10px; }
#qcardview .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#qcardview .close { background: #fff; color: var(--purple); border: 2px solid var(--purple); box-shadow: none; }
@media print { body > *:not(#qcardview) { display: none !important; } #qcardview { position: static; background: none; padding: 0; backdrop-filter: none; } #qcardview .box { width: 100%; border: 0; box-shadow: none; padding: 0; animation: none; } #qcardview .btns { display: none; } #qcardview img { border-radius: 0; } @page { size: A5; margin: 0; } }
#turn { display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; gap: 10px; background: rgba(255,244,224,.75); border: 2px solid var(--line); border-radius: 18px; padding: 6px 10px; }
#turn img { height: clamp(40px, 7vh, 64px); width: auto; display: block; }
#turn b { display: block; font: 400 clamp(1.05rem, 3.2vh, 1.4rem)/1.2 var(--display); color: var(--purple); }
#turn span { display: block; font-size: clamp(.85rem, 2.3vh, 1rem); color: var(--ink); word-break: keep-all; }
.tool { min-height: 40px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 20px; background: rgba(255,244,224,.6); color: var(--muted); font: .8125rem var(--body); cursor: pointer; white-space: nowrap; }
.tools { grid-column: 1 / -1; display: flex; gap: 6px; justify-content: flex-end; }
#dicebox { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
#stagebox { position: relative; min-height: 0; }
#hintbtn { display: inline-grid; grid-auto-flow: column; align-items: center; gap: 4px; min-height: 40px; padding: 0 10px 0 6px; border: 1.5px solid var(--purple); border-radius: 20px; background: #fff; color: var(--purple); font: 400 .875rem var(--display); cursor: pointer; }
#hintbtn svg { width: 30px; height: 30px; }
#hintbtn[aria-pressed="true"] { background: #fff4c2; }
/* 칸 카드: 말판을 가리지 않게 오른쪽(세로 화면에선 아래) 자리에 떠요 */
#card { position: absolute; inset: 0; z-index: 5; display: grid; align-content: safe center; gap: 8px; padding: 12px; text-align: center; background: var(--paper); border: 3px solid var(--line); border-radius: 22px; box-shadow: 0 8px 20px rgba(110,50,10,.2); overflow: auto; animation: pop .3s cubic-bezier(.3,1.6,.5,1); }
/* 덮개 화면들 */
.over { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: rgba(74,42,18,.55); backdrop-filter: blur(3px); }
.box { position: relative; width: min(100%, 460px); max-height: 100%; overflow: auto; background: var(--paper); border: 3px solid var(--line); border-radius: 28px; padding: 20px 18px; display: grid; gap: 14px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25); animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.box h2 { margin: 0; font: 400 1.5rem/1.3 var(--display); color: var(--purple); word-break: keep-all; }
.box p { margin: 0; word-break: keep-all; }
.big { min-height: 60px; border: 0; border-radius: 18px; background: var(--purple); color: #fff; font: 400 1.3rem var(--display); cursor: pointer; box-shadow: 0 4px 0 #522468; padding: 0 18px; }
.big:active { transform: translateY(2px); box-shadow: 0 2px 0 #522468; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.choices.two { grid-template-columns: repeat(2, 1fr); }
.choice { border: 3px solid var(--line); border-radius: 18px; background: #fff; padding: 6px; cursor: pointer; display: grid; gap: 4px; justify-items: center; font: 400 1rem var(--display); color: var(--ink); }
.choice img { width: 100%; max-height: 120px; object-fit: contain; display: block; }
.choice.house img { border-radius: 12px; object-fit: cover; aspect-ratio: 4/3; }
.choice:disabled { opacity: .3; cursor: default; }
.choice.num { font-size: 2rem; padding: 14px 0; }
#card .ic img { width: clamp(64px, 16vh, 120px); height: auto; display: block; margin: 0 auto; }
#card .faces { display: flex; justify-content: center; gap: 6px; }
#card .faces img { height: clamp(56px, 14vh, 100px); }
#card h2 { margin: 0; font: 400 1.2rem var(--display); color: var(--purple); }
#card .q { margin: 0; font: 400 clamp(1rem, 3.2vh, 1.3rem)/1.45 var(--display); color: var(--ink); word-break: keep-all; }
#card .key { margin: 0; font-size: .8125rem; color: var(--muted); word-break: keep-all; }
#card .big { min-height: 48px; font-size: 1.1rem; }
#card .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#card .again { background: #fff; color: var(--purple); border: 2px solid var(--purple); box-shadow: none; }
#win .faces { display: flex; justify-content: center; gap: 8px; }
#win .faces img { height: 130px; animation: jump .6s ease-in-out infinite alternate; }
#win .faces img:nth-child(2) { animation-delay: .3s; }
@keyframes jump { to { transform: translateY(-14px); } }
.confetti { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 11; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.toast.soft { background: var(--purple); box-shadow: 0 4px 0 #522468; font-size: clamp(1rem, 4cqh, 1.5rem); }
.toast { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); z-index: 5; background: var(--boom); color: #fff; font: 400 clamp(1.4rem, 6cqh, 2.4rem) var(--display); padding: 10px 22px; border-radius: 22px; box-shadow: 0 6px 0 #a3241a; animation: pop .35s cubic-bezier(.3,1.6,.5,1); pointer-events: none; }
@media (prefers-reduced-motion: reduce) { .spot.hint::before, .spot.hint::after, .piece.turn::after, #win .faces img, .box, .toast { animation: none; } .piece { transition: none; } }
#rotate { display: none; text-align: center; font-size: .85rem; color: var(--muted); }
/* 세로 화면: 말판 위, 주사위 아래 (가로로 돌리면 더 크게 보여요) */
@media (max-aspect-ratio: 1/1) {
  #app { grid-template-columns: none; grid-template-rows: auto auto minmax(0, 1fr); }
  #boardwrap { container-type: normal; }
  #board { width: 100%; height: auto; }
  #rotate { display: block; }
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="boardwrap"><div id="board">
    <img src="img/board.webp?v=2" alt="짝꿍 만나러 가요! 말판">
    <div id="layer"></div>
  </div></div>
  <div id="rotate">폰을 가로로 돌리면 말판이 더 크게 보여요</div>
  <aside id="side">
    <div id="turn">
      <img id="turnimg" src="img/mole/teal.webp" alt="">
      <div><b id="turnname">짝꿍 만나러 가요!</b><span id="turnmsg">놀 친구를 정해요</span></div>
      <div class="tools">
        <button id="hintbtn" type="button" aria-pressed="false" hidden title="갈 수 있는 칸 보기"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5a10 10 0 0 0-6 18c1.4 1.1 2 2.3 2 3.6V28h8v-1.4c0-1.3.6-2.5 2-3.6A10 10 0 0 0 20 5z" fill="#ffe27a" stroke="#7a3e9d" stroke-width="2"/><path d="M16 31h8M17 34.5h6" stroke="#7a3e9d" stroke-width="2" stroke-linecap="round"/><path d="M4 20l4-3v6zM36 20l-4-3v6z" fill="#7a3e9d"/></svg>힌트</button>
        <button class="tool" id="sound" type="button" aria-pressed="true">소리 켜짐</button>
        <button class="tool" id="restart" type="button">새 게임</button>
      </div>
    </div>
    <div id="stagebox">
      <iframe id="dicebox" src="./?embed=1" title="주사위"></iframe>
      <div id="card" hidden role="region" aria-live="polite" aria-labelledby="ctitle">
        <div class="ic"></div>
        <div class="faces"></div>
        <h2 id="ctitle"></h2>
        <p class="q"></p>
        <p class="key"></p>
        <div class="btns">
          <button class="big again" type="button">다시 듣기</button>
          <button class="big done" type="button">다 했어요</button>
        </div>
      </div>
    </div>
    <button id="qref" type="button" aria-haspopup="dialog"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="2.5" width="12" height="15" rx="2" fill="#fff" stroke="currentColor" stroke-width="1.5"/><path d="M7 7h6M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>참고 · 질문 카드 보기/인쇄</button>
  </aside>
</div>

<div id="setup" class="over"><div class="box" id="setupbox"></div></div>


<div id="qcardview" class="over" hidden role="dialog" aria-modal="true" aria-label="질문 카드">
  <div class="box">
    <img src="img/question-card.webp" alt="짝꿍 만나러 가요! 질문 카드: 지켜요·확인해요·골라요·생각해요 질문 각 3개와 하이파이브 칸 안내">
    <div class="btns">
      <button class="big close" type="button">닫기</button>
      <button class="big print" type="button">인쇄하기</button>
    </div>
  </div>
</div>

<div id="win" class="over" hidden role="dialog" aria-modal="true" aria-labelledby="wtitle">
  <div class="box">
    <h2 id="wtitle">짝꿍 만나기 성공!</h2>
    <div class="faces"></div>
    <p class="msg" style="font: 400 1.2rem/1.5 var(--display)"></p>
    <button class="big" id="again" type="button">다시 하기</button>
  </div>
</div>

<script>
(function () {
  /* ---------- 말판 지도 (말판 그림 1070×1470 기준 좌표) ----------
     둥근 길 27칸을 시계 방향으로 적었어요. s: 그림 칸 종류 */
  var BW = 1536, BH = 1024;
  var RING = [
    [347,250],[420,223],[530,190,"think"],[639,172],[739,170,"high"],[844,171],[960,180,"check"],[1078,216],
    [1155,246],[1220,340,"high"],[1285,450,"think"],[1291,525],[1270,630,"keep"],[1180,730,"pick"],
    [1075,778],[980,808],[880,826],[760,840,"check"],[637,821],[525,820,"high"],
    [432,775],[350,720,"think"],[255,640],[220,560,"keep"],[216,440],[265,355,"pick"]
  ];
  // 집: 길과 만나는 칸(j)
  var HOUSES = {
    tl: { name: "나무뿌리 집", pos: [190,215], j: 0 },
    tr: { name: "새싹 집", pos: [1345,215], j: 8 },
    br: { name: "돌멩이 집", pos: [1345,875], j: 14 },
    bl: { name: "단풍잎 집", pos: [190,875], j: 20 }
  };
  var MOLES = ["teal", "green", "overall", "orange", "yellow", "purple"];
  var Q = {
    think: { name: "생각해요", key: "내 생각도 소중해요. 먼저 말해 봐요.", list: [
      { t: "AI한테 묻기 전에 내 생각 먼저! 바람은 어디서 올까?", a: "audio/think1.mp3" },
      { t: "AI한테 묻기 전에 내 생각 먼저! 두더지는 땅속에서 뭘 먹을까?", a: "audio/think2.mp3" },
      { t: "AI가 “돌은 아무도 못 움직여요”라고 했어. 너는 어떻게 하면 움직일 수 있을 것 같아?", a: "audio/think3.mp3" }
    ]},
    check: { name: "확인해요", key: "AI 말도 한 번 더 확인해요.", list: [
      { t: "AI가 “바람이 불면 구름이 다 사라져요”라고 했어. 정말인지 어떻게 알아볼까?", a: "audio/check1.mp3" },
      { t: "AI가 “이 돌은 아무도 못 움직여요”라고 했어. 진짜인지 어떻게 알아볼까?", a: "audio/check2.mp3" },
      { t: "AI 말이 맞는지 헷갈릴 때, 누구에게 물어볼 수 있을까?", a: "audio/check3.mp3" }
    ]},
    pick: { name: "골라요", key: "AI는 도와줄 뿐, 고르는 건 나예요.", list: [
      { t: "AI가 “초코 맛이 제일 인기 있어요”라고 했어. 너는 무슨 맛 아이스크림을 고를래?", a: "audio/pick1.mp3" },
      { t: "AI가 “오늘은 블록 놀이를 하세요”라고 했어. 그런데 너는 그림 그리기가 하고 싶어. 어떻게 할래?", a: "audio/pick2.mp3" },
      { t: "AI가 공룡 책이랑 우주 책을 추천했어. 너는 어떤 책을 고를래?", a: "audio/pick3.mp3" }
    ]},
    keep: { name: "지켜요", key: "내 정보는 소중해요. 헷갈리면 어른에게 먼저 물어봐요.", list: [
      { t: "AI가 “어디 살아요? 주소를 알려 주세요” 하면 어떻게 할까?", a: "audio/keep1.mp3" },
      { t: "AI가 “이름이랑 유치원 이름을 알려 주세요” 하면 어떻게 할까?", a: "audio/keep2.mp3" },
      { t: "짝꿍 사진을 AI에 올리고 싶어. 먼저 누구에게 물어봐야 할까?", a: "audio/keep3.mp3" }
    ]},
    high: { name: "하이파이브", key: "짝꿍과 하이파이브하며 말해요!", list: [
      { t: "짝꿍과 하이파이브! \u201c너랑 놀아서 참 좋아!\u201d", a: "audio/high1.mp3" }
    ]}
  };

  var QIMG = { think: "img/think.png?v=2", check: "img/check.png?v=2", pick: "img/pick.png?v=2", keep: "img/keep.png?v=2", high: "img/high.png?v=2" };

  var layer = document.getElementById("layer");
  var dice = document.getElementById("dicebox");
  var turnImg = document.getElementById("turnimg"), turnName = document.getElementById("turnname"), turnMsg = document.getElementById("turnmsg");
  var soundBtn = document.getElementById("sound");
  var soundOn = true, players = [], cur = 0, busy = false, over = false;

  function pct(xy) { return { left: (xy[0] / BW * 100) + "%", top: (xy[1] / BH * 100) + "%" }; }
  // 칸 이름: "r3"(길), "s-br"(집 앞 디딤칸), "h-tl"(집)
  function xyOf(node) {
    if (node[0] === "r") return RING[+node.slice(1)];
    if (node[0] === "s") return HOUSES[node.slice(2)].stub;
    return HOUSES[node.slice(2)].pos;
  }
  function ownerOf(hk) { for (var i = 0; i < players.length; i++) if (players[i].house === hk) return i; return -1; }
  // 친구네 집이면(내 집 아님, 누군가 사는 집) 그 집 열쇠를 돌려줘요
  function friendHouseAt(ringIdx, me) {
    for (var k in HOUSES) if (HOUSES[k].j === ringIdx) { var o = ownerOf(k); if (o >= 0 && o !== me) return k; }
    return null;
  }
  function plan(p, steps, dir) {
    var me = players.indexOf(p), node = p.node, path = [];
    for (var n = steps; n > 0; n--) {
      var next;
      if (node[0] === "h") { // 집에서 나가기
        var hk = node.slice(2); next = HOUSES[hk].stub ? "s-" + hk : "r" + HOUSES[hk].j;
      } else if (node[0] === "s") {
        var sk = node.slice(2);
        next = (ownerOf(sk) >= 0 && ownerOf(sk) !== me) ? "h-" + sk : "r" + HOUSES[sk].j;
      } else {
        var i = +node.slice(1), fk = friendHouseAt(i, me);
        if (fk) next = HOUSES[fk].stub ? "s-" + fk : "h-" + fk; // 친구네 집 앞에 오면 들어가요
        else next = "r" + ((i + dir + RING.length) % RING.length);
      }
      path.push(next); node = next;
      if (node[0] === "h") break;
    }
    return path;
  }
  // 친구네 집 앞(디딤칸 포함)에서 출발하면 방향 없이 바로 들어가요
  function forced(p) {
    var me = players.indexOf(p);
    if (p.node[0] === "s") { var k = p.node.slice(2); return ownerOf(k) >= 0 && ownerOf(k) !== me; }
    if (p.node[0] === "r") return !!friendHouseAt(+p.node.slice(1), me);
    return false;
  }

  /* ---------- 그리기 ---------- */
  function render() {
    layer.querySelectorAll(".piece").forEach(function (e) { e.remove(); });
    var groups = {};
    players.forEach(function (p, i) { (groups[p.node] = groups[p.node] || []).push(i); });
    Object.keys(groups).forEach(function (node) {
      var list = groups[node], xy = xyOf(node);
      list.forEach(function (i, k) {
        var p = players[i];
        if (!p.el) { p.el = document.createElement("div"); p.el.className = "piece"; p.el.innerHTML = '<img src="img/mole/' + p.mole + '.webp" alt="' + (i + 1) + '번 친구">'; }
        var off = (k - (list.length - 1) / 2) * 46;
        var pos = pct([xy[0] + off, xy[1]]);
        p.el.style.left = pos.left; p.el.style.top = pos.top;
        p.el.classList.toggle("turn", i === cur && !over);
        layer.appendChild(p.el);
      });
    });
  }
  // 갈 칸 고르기: 모든 칸을 누를 수 있고, 맞는 칸이면 움직여요. 힌트를 누르면 갈 수 있는 칸이 반짝여요
  var pending = null, hintOn = false, hintBtn = document.getElementById("hintbtn");
  function allNodes() { var l = RING.map(function (_, i) { return "r" + i; }); for (var k in HOUSES) l.push("h-" + k); return l; }
  function showSpots() {
    clearMarks(); hintBtn.hidden = false; hintBtn.setAttribute("aria-pressed", String(hintOn));
    var goal = {}; pending.paths.forEach(function (path) { goal[path[path.length - 1]] = path; });
    allNodes().forEach(function (node) {
      var m = document.createElement("button"); m.type = "button"; m.className = "spot" + (hintOn && goal[node] ? " hint" : "");
      var pos = pct(xyOf(node)); m.style.left = pos.left; m.style.top = pos.top;
      m.setAttribute("aria-label", goal[node] ? "갈 수 있는 칸" : "칸");
      m.addEventListener("click", function () {
        if (!pending) return;
        if (goal[node]) { var p = pending.p; pending = null; hintOn = false; clearMarks(); move(p, goal[node]); }
        else { toast("한 칸씩 다시 세어 볼까요?", 1300, true); }
      });
      layer.appendChild(m);
    });
  }
  hintBtn.addEventListener("click", function () { if (!pending) return; hintOn = !hintOn; showSpots(); });
  function clearMarks() { layer.querySelectorAll(".spot").forEach(function (e) { e.remove(); }); hintBtn.hidden = true; }
  function toast(text, ms, soft) {
    var t = document.createElement("div"); t.className = "toast" + (soft ? " soft" : ""); t.textContent = text; layer.appendChild(t);
    setTimeout(function () { t.remove(); }, ms || 1400);
  }
  function setTurnBar(msg) {
    var p = players[cur];
    turnImg.src = "img/mole/" + p.mole + ".webp";
    turnName.textContent = (cur + 1) + "번 친구 차례";
    turnMsg.textContent = msg;
  }
  function post(o) { try { dice.contentWindow.postMessage(o, "*"); } catch (e) {} }

  /* ---------- 차례 ---------- */
  function startTurn() {
    busy = false; render();
    setTurnBar("주사위를 던져요!");
    post({ jj: "lock", on: false, text: (cur + 1) + "번 친구, 던져요!" });
  }
  function nextTurn() { if (over) return; cur = (cur + 1) % players.length; startTurn(); }

  window.addEventListener("message", function (e) {
    var d = e.data || {};
    if (d.jj !== "roll" || e.source !== dice.contentWindow || busy || over || !players.length) return;
    busy = true;
    var p = players[cur];
    if (!d.n) { setTurnBar("펑! 이번엔 쉬어 가요"); toast("펑! 쉬어 가요"); setTimeout(nextTurn, 1700); return; }
    if (forced(p)) { setTurnBar(d.n + "칸! 짝꿍네 집으로 쏙!"); setTimeout(function () { move(p, plan(p, d.n, 1)); }, 600); return; }
    var a = plan(p, d.n, 1), b = plan(p, d.n, -1);
    pending = { p: p, paths: [a] };
    if (b[b.length - 1] !== a[a.length - 1]) pending.paths.push(b);
    setTurnBar(d.n + "칸! 세어 보고 갈 칸을 눌러요");
    showSpots();
  });

  function move(p, path) {
    unlockAudio();
    var k = 0;
    (function step() {
      if (k >= path.length) { land(p); return; }
      p.node = path[k++]; render();
      p.el.classList.remove("hop"); void p.el.offsetWidth; p.el.classList.add("hop");
      tick();
      setTimeout(step, 300);
    })();
  }
  function land(p) {
    var me = players.indexOf(p);
    if (p.node[0] === "h") { win(me, ownerOf(p.node.slice(2))); return; }
    var mates = players.filter(function (o, i) { return i !== me && o.node === p.node; });
    if (mates.length) { showCard("meet", p, mates); return; }
    var s = p.node[0] === "r" ? RING[+p.node.slice(1)][2] : null;
    if (s) { showCard(s, p); return; }
    setTimeout(nextTurn, 500);
  }

  /* ---------- 카드 ---------- */
  var card = document.getElementById("card"), cIc = card.querySelector(".ic"), cFaces = card.querySelector(".faces");
  var cTitle = document.getElementById("ctitle"), cQ = card.querySelector(".q"), cKey = card.querySelector(".key");
  var bag = {}, curItem = null, player = null, koVoice = null;
  function nextIndex(k) {
    var n = Q[k].list.length;
    if (!bag[k] || !bag[k].length) { var a = []; for (var i = 0; i < n; i++) a.push(i); for (var j = n - 1; j > 0; j--) { var r = Math.floor(Math.random() * (j + 1)), t = a[j]; a[j] = a[r]; a[r] = t; } bag[k] = a; }
    return bag[k].shift();
  }
  function showCard(kind, p, mates) {
    var k = kind === "meet" ? "high" : kind, g = Q[k], item = g.list[nextIndex(k)];
    if (typeof item === "string") item = { t: item };
    curItem = item;
    cIc.innerHTML = '<img src="' + QIMG[k] + '" alt="">';
    cFaces.innerHTML = "";
    if (kind === "meet") {
      cIc.innerHTML = "";
      [p].concat(mates).forEach(function (o) { cFaces.innerHTML += '<img src="img/mole/' + o.mole + '.webp" alt="">'; });
      cTitle.textContent = "길에서 친구를 만났어요!"; cTitle.hidden = false;
      cQ.textContent = "하이파이브! “너랑 놀아서 참 좋아!”";
      cKey.textContent = "만난 친구와 손바닥을 마주쳐요";
    } else {
      cTitle.textContent = kind === "high" ? "하이파이브 칸!" : g.name;
      cTitle.hidden = true; // 그림 안에 이름이 들어 있어요
      cQ.textContent = item.t; cKey.textContent = g.key;
    }
    card.hidden = false; dice.style.visibility = "hidden"; say(item);
    setTurnBar(kind === "meet" || kind === "high" ? "하이파이브 해요!" : "질문에 대답해요");
    setTimeout(function () { try { card.querySelector(".done").focus(); } catch (e) {} }, 50);
  }
  card.querySelector(".again").addEventListener("click", function () { say(curItem); });
  card.querySelector(".done").addEventListener("click", function () { stopVoice(); card.hidden = true; dice.style.visibility = ""; nextTurn(); });

  /* ---------- 소리 ---------- */
  var actx = null;
  function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {} }
  function tick() {
    if (!soundOn || !actx) return;
    try { var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(880, t + .06); g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .12); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + .13); } catch (e) {}
  }
  function stopVoice() { try { speechSynthesis.cancel(); } catch (e) {} if (player) { try { player.pause(); } catch (e) {} player = null; } }
  function speak(t) {
    if (!window.speechSynthesis) return;
    try { var u = new SpeechSynthesisUtterance(t.replace(/[“”"]/g, "")); u.lang = "ko-KR"; u.rate = .9; if (koVoice) u.voice = koVoice; speechSynthesis.speak(u); } catch (e) {}
  }
  function say(item) {
    stopVoice(); if (!soundOn || !item) return;
    if (item.a) { try { player = new Audio(item.a); player.play().catch(function () { speak(item.t); }); return; } catch (e) {} }
    speak(item.t);
  }
  try { var pv = function () { koVoice = speechSynthesis.getVoices().filter(function (v) { return /^ko/i.test(v.lang); })[0] || null; }; pv(); speechSynthesis.onvoiceschanged = pv; } catch (e) {}
  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn; soundBtn.textContent = soundOn ? "소리 켜짐" : "소리 꺼짐"; soundBtn.setAttribute("aria-pressed", String(soundOn));
    if (!soundOn) stopVoice(); post({ jj: "sound", on: soundOn });
  });

  /* ---------- 성공 ---------- */
  var winEl = document.getElementById("win");
  function win(a, b) {
    over = true; render(); post({ jj: "lock", on: true });
    var pa = players[a], pb = players[b];
    winEl.querySelector(".faces").innerHTML = '<img src="img/mole/' + pa.mole + '.webp" alt=""><img src="img/mole/' + pb.mole + '.webp" alt="">';
    winEl.querySelector(".msg").textContent = (a + 1) + "번 친구가 " + (b + 1) + "번 친구네 " + HOUSES[pb.house].name + "에 놀러 왔어요! 다 같이 “어서 와!”";
    turnName.textContent = "짝꿍 만나기 성공!"; turnMsg.textContent = "모두 함께 해냈어요";
    winEl.hidden = false; confetti();
  }
  function confetti() {
    var colors = ["#7a3e9d", "#e7b416", "#e0526a", "#3d7fd0", "#6fb04a"];
    for (var i = 0; i < 60; i++) {
      var c = document.createElement("div"); c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw"; c.style.background = colors[i % colors.length];
      c.style.animationDuration = (2 + Math.random() * 2) + "s"; c.style.animationDelay = Math.random() * .8 + "s";
      document.body.appendChild(c); setTimeout(function (el) { el.remove(); }.bind(null, c), 4800);
    }
  }
  document.getElementById("again").addEventListener("click", function () { winEl.hidden = true; openSetup(); });
  document.getElementById("restart").addEventListener("click", function () { if (!players.length || confirm("처음부터 다시 할까요?")) openSetup(); });

  /* ---------- 시작 준비 ---------- */
  var setup = document.getElementById("setup"), sbox = document.getElementById("setupbox");
  var want = 0, draft = [];
  function openSetup() {
    stopVoice(); card.hidden = true; dice.style.visibility = ""; winEl.hidden = true; clearMarks(); pending = null; hintOn = false;
    players.forEach(function (p) { if (p.el) p.el.remove(); });
    players = []; draft = []; cur = 0; over = false; busy = true;
    post({ jj: "lock", on: true });
    turnName.textContent = "짝꿍 만나러 가요!"; turnMsg.textContent = "놀 친구를 정해요";
    setup.hidden = false;
    sbox.innerHTML = '<h2>몇 명이 함께 놀아요?</h2><div class="choices"></div><p style="color:var(--muted);font-size:.9rem">폰이나 태블릿 하나를 차례대로 돌려 가며 놀아요</p>';
    [2, 3, 4].forEach(function (n) {
      var b = document.createElement("button"); b.type = "button"; b.className = "choice num"; b.textContent = n + "명";
      b.addEventListener("click", function () { unlockAudio(); want = n; pickMole(); });
      sbox.querySelector(".choices").appendChild(b);
    });
  }
  function pickMole() {
    var k = draft.length;
    sbox.innerHTML = '<h2>' + (k + 1) + '번 친구, 내 두더지를 골라요</h2><div class="choices"></div>';
    MOLES.forEach(function (m) {
      var b = document.createElement("button"); b.type = "button"; b.className = "choice";
      b.innerHTML = '<img src="img/mole/' + m + '.webp" alt="두더지">';
      b.disabled = draft.some(function (d) { return d.mole === m; });
      b.addEventListener("click", function () { draft.push({ mole: m }); pickHouse(); });
      sbox.querySelector(".choices").appendChild(b);
    });
  }
  function pickHouse() {
    var k = draft.length - 1;
    sbox.innerHTML = '<h2>' + (k + 1) + '번 친구, 내 집을 골라요</h2><div class="choices two"></div>';
    ["tl", "tr", "bl", "br"].forEach(function (h) {
      var b = document.createElement("button"); b.type = "button"; b.className = "choice house";
      b.innerHTML = '<img src="img/house_' + h + '.webp?v=2" alt="">' + HOUSES[h].name;
      b.disabled = draft.some(function (d) { return d.house === h; });
      b.addEventListener("click", function () {
        draft[k].house = h;
        if (draft.length < want) pickMole(); else begin();
      });
      sbox.querySelector(".choices").appendChild(b);
    });
  }
  function begin() {
    players = draft.map(function (d) { return { mole: d.mole, house: d.house, node: "h-" + d.house }; });
    setup.hidden = true; cur = 0; startTurn();
  }
  dice.addEventListener("load", function () {
    post({ jj: "sound", on: soundOn });
    if (players.length && !busy && !over) post({ jj: "lock", on: false, text: (cur + 1) + "번 친구, 던져요!" }); else post({ jj: "lock", on: true });
  });
  var qv = document.getElementById("qcardview");
  document.getElementById("qref").addEventListener("click", function () { qv.hidden = false; });
  qv.querySelector(".close").addEventListener("click", function () { qv.hidden = true; });
  qv.querySelector(".print").addEventListener("click", function () { window.print(); });
  qv.addEventListener("click", function (e) { if (e.target === qv) qv.hidden = true; });
  openSetup();
})();
</script>
</body>
</html>
