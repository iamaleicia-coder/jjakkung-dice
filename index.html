<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>짝꿍 주사위</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* VOICE: 흙집과 나무뿌리 말판 옆에 놓인 펠트 장난감
   IDEA: 말판의 흙빛 땅 위에 알록달록 팔면체 주사위를 굴린다
   PICTURE: 가운데 큰 팔면체 주사위, 아래 큰 결과 글자
   COLOUR and TYPE: 노을빛 흙 바탕, 보라 버튼(말판 제목 색), 1번 빨강·2번 파랑 / Jua + Gowun Dodum
   LAYOUT: 위 두 사람 패, 가운데 주사위, 아래 결과와 던지기 버튼 */
:root {
  color-scheme: light;
  --ink: #4a2a12; --muted: #8a5a30; --line: #d9934e; --paper: #fff4e0;
  --purple: #7a3e9d; --p1: #e2553f; --p2: #3d7fd0; --boom: #e8402a;
  --display: "Jua", "Gowun Dodum", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; min-width: 0; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 70% at 50% 40%, #fbd7a0, #eea461 70%, #e08c45);
  background-color: #eea461; color: var(--ink); font-family: var(--body);
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%; max-width: 560px; margin-inline: auto;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 8px;
  padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
header { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: start; gap: 8px; }
header h1 { grid-column: 2; }
.logo { display: block; height: clamp(96px, 17vh, 140px); width: auto; filter: drop-shadow(2px 0 0 #fff6e6) drop-shadow(-2px 0 0 #fff6e6) drop-shadow(0 2px 0 #fff6e6) drop-shadow(0 -2px 0 #fff6e6) drop-shadow(0 4px 6px rgba(90,40,0,.18)); }
h1 { margin: 0; font: 400 1.45rem var(--display); color: var(--purple); white-space: nowrap; }
.tools { grid-column: 3; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.tool { min-height: 40px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 20px; background: rgba(255,244,224,.5); color: var(--muted); font: 0.8125rem var(--body); cursor: pointer; white-space: nowrap; }
#players { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 8px; }
.pl { border: 2px solid rgba(217,147,78,.6); border-radius: 16px; padding: 8px 12px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 8px; background: rgba(255,244,224,.55); transition: border-color .2s, background .2s; }
.pl .dot { width: 12px; height: 12px; border-radius: 50%; }
.pl.s1 .dot { background: var(--p1); } .pl.s2 .dot { background: var(--p2); }
.pl .nm { font-size: .9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl .nm small { color: var(--muted); font-size: .75rem; margin-left: 4px; }
.pl .v { font: 400 1.5rem/1 var(--display); }
.pl .v.sm { font-size: 1.2rem; color: var(--boom); }
.pl.turn.s1 { border-color: var(--p1); background: #fff0e4; }
.pl.turn.s2 { border-color: var(--p2); background: #eef4ff; }
.pl.empty { opacity: .6; }
#stage { position: relative; min-height: 0; }
#dice { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#result { text-align: center; min-height: 108px; display: flex; flex-direction: column; justify-content: center; }
#who { font-size: .9375rem; color: var(--muted); min-height: 1.4em; }
#who.s1 { color: var(--p1); } #who.s2 { color: var(--p2); }
#number { font: 400 clamp(3.2rem, 13vh, 4.8rem)/1 var(--display); color: var(--ink); }
#number .unit { font-size: .45em; margin-left: .12em; color: var(--muted); }
#number.word { color: var(--boom); animation: pop .5s cubic-bezier(.3,1.8,.5,1); }
#number.idle { font-size: 1.35rem; line-height: 1.4; }
@keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { #number.word { animation: none; } }
#hint { margin-top: 4px; color: var(--muted); font-size: .9375rem; min-height: 1.4em; }
#controls { display: grid; gap: 10px; }
#throw { height: 60px; border: 0; border-radius: 18px; background: var(--purple); color: #fff; font: 400 1.35rem var(--display); cursor: pointer; box-shadow: 0 4px 0 #522468; transition: transform .12s, opacity .12s; }
#throw:active { transform: translateY(3px); box-shadow: 0 1px 0 #522468; }
#throw:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--purple); outline-offset: 2px; }
#history { display: flex; align-items: center; gap: 6px; min-height: 28px; color: var(--muted); font-size: .8125rem; flex-wrap: wrap; }
#history b { font-weight: 400; color: var(--ink); min-width: 28px; text-align: center; border: 1.5px solid var(--line); border-radius: 8px; padding: 1px 5px; background: rgba(255,244,224,.6); }
#history b.s1 { border-color: var(--p1); } #history b.s2 { border-color: var(--p2); }
#conn { font-size: .75rem; color: var(--muted); text-align: center; }
#table { font: 400 .9rem var(--display); color: var(--purple); text-align: center; margin-top: -6px; }
#seat { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 20px; background: rgba(74,42,18,.5); backdrop-filter: blur(3px); }
#seat .box { width: min(100%, 380px); background: var(--paper); border-radius: 24px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
#seat h2 { margin: 0; font: 400 1.5rem var(--display); color: var(--purple); }
#seat p { margin: 0; color: var(--muted); font-size: .9375rem; }
#seat .rule { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; text-align: center; font-size: .8125rem; }
#seat .rule div { border-radius: 12px; padding: 6px 2px; }
#seat .rule b { display: block; font: 400 1.3rem var(--display); }
#seat input { font: 16px var(--body); min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); }
#seat .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#seat .row button { min-height: 56px; border: 0; border-radius: 14px; font: 400 1.15rem var(--display); cursor: pointer; color: #fff; }
#seat .b1 { background: var(--p1); } #seat .b2 { background: var(--p2); }
#seat .row button:disabled { opacity: .35; cursor: default; }
#seat .taken { font-size: .8125rem; color: var(--muted); min-height: 1.2em; }
[hidden] { display: none !important; }
</style>
</head>

  var bursts = [], hop = 0, driftX = 0, rolling = null, ripples = [], history = [], soundOn = true, audio = null, dirty = true;
  var LIGHT = norm([-0.45, 0.65, 0.65]);
  // 함께 하기
  var me = { n: 0, v: 0, dx: 0, dy: 0, p: 0 };
  var seen = {}, room = null, queue = [];

  function resize() {
    var r = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    dirty = true;
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
  window.addEventListener("resize", resize);

  function fairRoll() {
    if (window.crypto && crypto.getRandomValues) {
      var b = new Uint8Array(1);
      do { crypto.getRandomValues(b); } while (b[0] >= 248);
      return (b[0] % 8) + 1;
    }
    return Math.floor(Math.random() * 8) + 1;
  }

  /* ---------- sound ---------- */
  function ensureAudio() {
    if (!soundOn) return;
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
    } catch (e) { audio = null; }
  }
  function knock(strength) {
    if (!soundOn || !audio) return;
    try {
      var t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(520 + Math.random() * 120, t);
      o.frequency.exponentialRampToValueAtTime(210, t + 0.07);
      g.gain.setValueAtTime(0.5 * strength, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      o.connect(g); g.connect(audio.destination);
      o.start(t); o.stop(t + 0.11);
    } catch (e) {}
  }

  /* ---------- 버튼 ---------- */
  function canThrow() { return !rolling && !queue.length; }
  function renderBtn() { throwBtn.disabled = !canThrow(); }

  function boomSound() {
    if (!soundOn || !audio) return;
    try {
      var t = audio.currentTime, len = 0.35, buf = audio.createBuffer(1, Math.floor(audio.sampleRate * len), audio.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
      var src = audio.createBufferSource(), g = audio.createGain(), f = audio.createBiquadFilter();
      f.type = "lowpass"; f.frequency.value = 900;
      src.buffer = buf; g.gain.value = 0.8;
      src.connect(f); f.connect(g); g.connect(audio.destination); src.start(t);
    } catch (e) {}
  }

  /* ---------- throw ---------- */
  function startThrow(dirX, dirY, power, given, seat) {
    if (rolling) return;
    ensureAudio();
    var result = given || fairRoll();
    var target = restPose(result);
    var axis = norm([-dirY || 0.6, dirX || 0.5, (Math.random() - 0.5) * 0.7]);
    var total = reduced ? 0 : (9 + Math.random() * 3 + power * 6) * Math.PI;
    var start = qMul(qAxis(axis, -total), q);
    rolling = {
      t0: performance.now(), dur: reduced ? 200 : 1500 + power * 350,
      axis: axis, total: total, start: start, target: target, result: result, seat: seat,
      driftFrom: (dirX || 0) * Math.min(W * 0.12, 60), lastBounce: -1, height: reduced ? 0 : 0.55 + power * 0.15
    };
    throwBtn.disabled = true;
    whoEl.className = seat === "me" ? "s1" : "s2";
    whoEl.textContent = seat === "me" ? "내가 던졌어요" : "다른 폰에서 던졌어요";
    numberEl.className = "idle";
    numberEl.textContent = "데구르르…";
    hintEl.textContent = " ";
    return result;
  }
  function finishThrow(r) {
    q = r.target; hop = 0; driftX = 0; rolling = null;
    var fc = FACE[r.result];
    if (fc.n) {
      numberEl.className = "";
      numberEl.innerHTML = fc.n + '<span class="unit">칸</span>';
      hintEl.textContent = "말을 " + fc.n + "칸 옮기세요";
    } else {
      numberEl.className = "word";
      numberEl.textContent = "펑!";
      hintEl.textContent = "이번엔 쉬어 가요";
      bursts.push({ t0: performance.now() });
      boomSound();
    }
    history.unshift({ v: r.result, s: r.seat === "me" ? 1 : 2 });
    history = history.slice(0, 8);
    renderHistory();
    try { if (navigator.vibrate) navigator.vibrate(r.seat === "me" ? 30 : [20, 60, 20]); } catch (e) {}
    dirty = true;
    if (queue.length) { var n = queue.shift(); setTimeout(function () { playRemote(n); }, 500); }
    renderBtn();
  }
  function renderHistory() {
    historyEl.innerHTML = "<span>지난 결과</span>" + history.map(function (h) { return '<b class="s' + h.s + '">' + shortOf(h.v) + "</b>"; }).join("");
  }
  function myThrow(dx, dy, power) {
    if (!canThrow()) return;
    var v = startThrow(dx, dy, power, 0, "me");
    me.n++; me.v = v; me.dx = Math.round(dx * 100) / 100; me.dy = Math.round(dy * 100) / 100; me.p = Math.round(power * 100) / 100;
    push();
  }
  function playRemote(o) {
    if (rolling) { queue.push(o); return; }
    startThrow(o.dx || 0.5, o.dy || -0.7, o.p || 0.4, o.v, "other");
  }

  // 튕기는 횟수를 3번으로 고정한 포물선 높이
  var BOUNCES = [[0, 0.46, 1], [0.46, 0.76, 0.42], [0.76, 0.93, 0.15]];
  function updateRoll(now) {
    var r = rolling, t = Math.min((now - r.t0) / r.dur, 1);
    var rem = r.total * Math.pow(1 - t, 3);
    var settle = t * t * (3 - 2 * t);
    q = qNorm(qMul(qAxis(r.axis, rem), qSlerp(r.start, r.target, settle)));
    driftX = r.driftFrom * (1 - t) * (1 - t);
    hop = 0;
    BOUNCES.forEach(function (b, i) {
      if (t >= b[0] && t < b[1]) {
        var p = (t - b[0]) / (b[1] - b[0]);
        hop = 4 * p * (1 - p) * b[2] * r.height;
      }
      if (t >= b[1] && r.lastBounce < i) {
        r.lastBounce = i;
        knock(b[2]);
        ripples.push({ t0: now, power: b[2] });
      }
    });
    if (t >= 1) finishThrow(r);
  }

  /* ---------- drawing ---------- */
  function mix(a, b, t) { return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
  function rgb(c) { return "rgb(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ")"; }
  var RIPPLE = "150,80,30";

  function draw(now) {
    if (!W || !H) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var S = Math.min(W * 0.4, H * 0.37);
    var groundY = H * 0.66, cx = W / 2 + driftX, lift = hop * H * 0.42;
    var cy = groundY - lift - S * 0.18;

    ctx.lineWidth = 1.5;
    ripples = ripples.filter(function (r) { return now - r.t0 < 1300; });
    ripples.forEach(function (r) {
      var p = (now - r.t0) / 1300;
      [0, 0.22].forEach(function (off) {
        var pp = p - off; if (pp <= 0) return;
        ctx.strokeStyle = "rgba(" + RIPPLE + "," + ((1 - pp) * 0.55 * r.power) + ")";
        ctx.beginPath();
        ctx.ellipse(W / 2, groundY + S * 0.72, S * (0.9 + pp * 1.5), S * (0.22 + pp * 0.38), 0, 0, Math.PI * 2);
        ctx.stroke();
      });
    });
    var shadow = 1 / (1 + hop * 1.6);
    ctx.fillStyle = "rgba(120,55,10," + (0.35 * shadow) + ")";
    ctx.beginPath();
    ctx.ellipse(cx, groundY + S * 0.72, S * 0.95 * shadow, S * 0.2 * shadow, 0, 0, Math.PI * 2);
    ctx.fill();

    var CAM = 6;
    function proj(p) { var r = qRot(q, p), f = CAM / (CAM - r[2]); return [cx + r[0] * S * f, cy - r[1] * S * f]; }
    faces.forEach(function (face) {
      var nr = qRot(q, face.n), cr = qRot(q, face.c);
      if (nr[0]*(-cr[0]) + nr[1]*(-cr[1]) + nr[2]*(CAM - cr[2]) <= 0) return;
      var pts = face.verts.map(proj);
      var light = Math.max(0, dot(nr, LIGHT));
      var base = FACE[face.label].c, col = mix([base[0]*0.55, base[1]*0.55, base[2]*0.55], mix(base, [255,255,255], 0.15), 0.25 + 0.75 * light);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.beginPath();
      pts.forEach(function (p, i) { if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); });
      ctx.closePath();
      ctx.fillStyle = rgb(col);
      ctx.fill();

      var e = 0.01, pc = proj(face.c);
      var pu = proj([face.c[0]+face.u[0]*e, face.c[1]+face.u[1]*e, face.c[2]+face.u[2]*e]);
      var pv = proj([face.c[0]-face.v[0]*e, face.c[1]-face.v[1]*e, face.c[2]-face.v[2]*e]);
      var ax = (pu[0]-pc[0])/e, ay = (pu[1]-pc[1])/e, bx = (pv[0]-pc[0])/e, by = (pv[1]-pc[1])/e;

      ctx.setTransform(dpr*ax/100, dpr*ay/100, dpr*bx/100, dpr*by/100, dpr*pc[0], dpr*pc[1]);
      var fc = FACE[face.label];
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      if (fc.boom) {
        // 터지는 별 모양
        ctx.fillStyle = "#fff3a6";
        ctx.beginPath();
        for (var k = 0; k < 16; k++) { var ang = k * Math.PI / 8, rr = k % 2 ? 17 : 34; ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr + 4); }
        ctx.closePath(); ctx.fill();
        ctx.font = '400 30px "Jua", sans-serif';
        ctx.fillStyle = "#c2241a"; ctx.fillText("펑", 0, 6);
      } else {
        ctx.font = '400 54px "Jua", sans-serif';
        ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.fillText(String(fc.n), 1.5, 9.5);
        ctx.fillStyle = "#4a2a12"; ctx.fillText(String(fc.n), 0, 8);
      }

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.beginPath();
      pts.forEach(function (p, i) { if (i) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]); });
      ctx.closePath();
      ctx.lineJoin = "round";
      ctx.lineWidth = Math.max(2, S * 0.022);
      ctx.strokeStyle = "#7a4a22";
      ctx.stroke();
    });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bursts = bursts.filter(function (b) { return now - b.t0 < 900; });
    bursts.forEach(function (b) {
      var p = (now - b.t0) / 900, cols = ["#ff5a3c", "#ffd65a", "#7a3e9d", "#3d7fd0", "#96d26e"];
      for (var k = 0; k < 18; k++) {
        var ang = k / 18 * Math.PI * 2, d = S * (0.9 + p * 1.4);
        ctx.fillStyle = cols[k % 5]; ctx.globalAlpha = 1 - p;
        ctx.beginPath(); ctx.arc(cx + Math.cos(ang) * d, cy + Math.sin(ang) * d * 0.8, 7 * (1 - p * 0.6), 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    });
  }

  function frame(now) {
    if (rolling) updateRoll(now);
    if (rolling || ripples.length || bursts.length || dirty) { draw(now); dirty = false; }
    requestAnimationFrame(frame);
  }

  /* ---------- gestures ---------- */
  var drag = null;
  canvas.addEventListener("pointerdown", function (e) {
    if (rolling) return;
    drag = { x: e.clientX, y: e.clientY, t: performance.now(), vx: 0, vy: 0, moved: 0 };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!drag || rolling) return;
    var now = performance.now(), dx = e.clientX - drag.x, dy = e.clientY - drag.y, dt = Math.max(now - drag.t, 1);
    drag.vx = drag.vx * 0.4 + (dx / dt) * 0.6;
    drag.vy = drag.vy * 0.4 + (dy / dt) * 0.6;
    drag.x = e.clientX; drag.y = e.clientY; drag.t = now;
    drag.moved += Math.hypot(dx, dy);
    var len = Math.hypot(dx, dy);
    if (len) { q = qNorm(qMul(qAxis([dy, dx, 0], len * 0.012), q)); dirty = true; }
  });
  canvas.addEventListener("pointerup", function () {
    if (!drag) return;
    var d = drag; drag = null;
    if (rolling) return;
    var speed = Math.hypot(d.vx, d.vy), idle = performance.now() - d.t;
    if (idle > 150) speed = 0;
    if (d.moved < 10 || speed > 0.25) {
      var l = speed || 1;
      myThrow(d.moved < 10 ? 0.7 * (Math.random() < 0.5 ? -1 : 1) : d.vx / l, d.moved < 10 ? -0.7 : d.vy / l, Math.min(speed / 3, 1));
    } else {
      hintEl.textContent = "빠르게 튕기면 던져져요";
    }
  });
  canvas.addEventListener("pointercancel", function () { drag = null; });
  throwBtn.addEventListener("click", function () {
    var a = Math.random() * Math.PI * 2;
    myThrow(Math.cos(a), Math.sin(a), 0.4);
  });
  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "소리 켜짐" : "소리 꺼짐";
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    if (soundOn) ensureAudio();
  });

  /* ---------- 흔들어서 던지기 ---------- */
  var shakeBtn = document.getElementById("shake"), lastShake = 0, shakeOn = false, base = null;
  function onMotion(e) {
    var a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
    var m = Math.hypot(a.x, a.y, a.z), now = Date.now();
    if (m > 22 && now - lastShake > 1800) {
      lastShake = now;
      var l = Math.hypot(a.x, a.y) || 1;
      myThrow(a.x / l, -a.y / l, Math.min((m - 18) / 20, 1));
    }
  }
  shakeBtn.addEventListener("click", function () {
    ensureAudio();
    var go = function () {
      if (!shakeOn) { window.addEventListener("devicemotion", onMotion); shakeOn = true; }
      var got = false, probe = function (e) { if (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x != null) got = true; };
      window.addEventListener("devicemotion", probe);
      shakeBtn.textContent = "확인 중…";
      setTimeout(function () {
        window.removeEventListener("devicemotion", probe);
        shakeBtn.textContent = got ? "흔들기 켜짐" : "흔들기 안 됨";
        hintEl.textContent = got ? "폰을 힘껏 흔들면 던져져요" : "이 화면에선 흔들기가 막혀 있어요. 손가락으로 튕겨 주세요";
      }, 1200);
    };
    try {
      if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        DeviceMotionEvent.requestPermission().then(function (r) {
          if (r === "granted") go(); else { shakeBtn.textContent = "흔들기 거절됨"; }
        }, function () { shakeBtn.textContent = "흔들기 안 됨"; hintEl.textContent = "이 화면에선 흔들기가 막혀 있어요. 손가락으로 튕겨 주세요"; });
      } else go();
    } catch (e) { shakeBtn.textContent = "흔들기 안 됨"; }
  });

  /* ---------- 실시간 연결: 무료 공개 MQTT 중계 (가입 없음) ---------- */
  // 주소의 ?t=번호 로 테이블(방)을 나눔. 같은 번호끼리만 주사위가 보임
  var params = new URLSearchParams(location.search);
  var table = (params.get("t") || "1").replace(/[^0-9a-zA-Z_-]/g, "").slice(0, 12) || "1";
  document.getElementById("table").textContent = table + "번 테이블";
  var BASE = "jjakkung-dice/v1/" + table + "/";
  var myId = Math.random().toString(36).slice(2, 10);
  var SERVERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt"];
  var client = null, here = {}, connected = false;
  function num(x, lo, hi, d) { x = Number(x); return isFinite(x) ? Math.min(hi, Math.max(lo, x)) : d; }
  function push() {
    if (!client || !connected) return;
    client.publish(BASE + "roll", JSON.stringify({ id: myId, n: me.n, v: me.v, dx: me.dx, dy: me.dy, p: me.p }));
  }
  function hello() { if (client && connected) client.publish(BASE + "here", JSON.stringify({ id: myId })); }
  function showConn() {
    if (!connected) return;
    var now = Date.now(), count = 0;
    for (var k in here) { if (now - here[k] < 25000) count++; else delete here[k]; }
    connEl.textContent = count ? "실시간 연결됨 · 함께 보는 폰 " + count + "대" : "실시간 연결됨 · 다른 폰을 기다리는 중";
  }
  function onMessage(topic, payload) {
    var g; try { g = JSON.parse(payload.toString()); } catch (e) { return; }
    if (!g || typeof g !== "object" || typeof g.id !== "string" || g.id === myId) return;
    var id = g.id.slice(0, 12);
    here[id] = Date.now();
    if (topic === BASE + "roll") {
      var v = Math.floor(num(g.v, 0, 8, 0));
      if (v >= 1) playRemote({ v: v, dx: num(g.dx, -1, 1, 0.5), dy: num(g.dy, -1, 1, -0.7), p: num(g.p, 0, 1, 0.4) });
    }
    showConn();
  }
  function connect(i) {
    if (!window.mqtt) { connEl.textContent = "실시간 연결이 안 돼요 · 이 폰에서만 던질 수 있어요"; return; }
    var url = SERVERS[i % SERVERS.length], opened = false;
    connEl.textContent = "연결 중…";
    try {
      client = window.mqtt.connect(url, { clientId: "jjk_" + myId + "_" + i, clean: true, connectTimeout: 7000, reconnectPeriod: 3000, keepalive: 30 });
    } catch (e) { setTimeout(function () { connect(i + 1); }, 500); return; }
    var c = client;
    var giveUp = setTimeout(function () { if (!opened) { try { c.end(true); } catch (e) {} connect(i + 1); } }, 9000);
    c.on("connect", function () {
      opened = true; clearTimeout(giveUp); connected = true;
      c.subscribe([BASE + "roll", BASE + "here"]);
      hello(); showConn();
    });
    c.on("reconnect", function () { if (opened) connEl.textContent = "다시 연결하는 중…"; });
    c.on("offline", function () { connected = false; if (opened) connEl.textContent = "다시 연결하는 중…"; });
    c.on("message", onMessage);
  }
  connect(0);
  setInterval(function () { hello(); showConn(); }, 10000);

  resize();
  renderBtn();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('400 54px "Jua"', "123펑").then(function () { dirty = true; }, function () {});
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
